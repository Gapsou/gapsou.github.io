<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Générateur de signal - Gapsou</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    section h2 {
      font-size: 0.8em;
    }

    /* Instrument rows: screen on the left, its controls on the right */
    .instrument-row {
      display: flex;
      gap: 32px;
      flex-wrap: wrap;
      align-items: flex-start;
    }

    .instrument-row + .instrument-row {
      margin-top: 30px;
      padding-top: 30px;
      border-top: 3px dashed #e2ddc9;
    }

    .screen-col {
      flex: 1 1 440px;
      min-width: 280px;
    }

    .controls-col {
      flex: 1 1 260px;
      min-width: 240px;
      max-width: 320px;
    }

    /* Per-instrument color themes, applied via CSS variables */
    .osc-theme {
      --accent: #39ff14;
      --bezel: #12160f;
      --screen-bg: #02140a;
      --readout-color: #39ff14;
    }

    .spec-theme {
      --accent: #ffb020;
      --bezel: #1b1c22;
      --screen-bg: #0a0a10;
      --readout-color: #ffb020;
    }

    /* Screens */
    .scope-wrap {
      background: var(--bezel, #1b1f1c);
      border: 3px solid var(--accent);
      padding: 14px;
      box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.2);
    }

    .screen-stack {
      position: relative;
      width: 100%;
    }

    .screen-stack canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    .screen-stack canvas:not(.overlay) {
      background: var(--screen-bg, #02140a);
    }

    .screen-stack canvas.overlay {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    .readout {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 12px;
      font-family: var(--font-mono, 'Courier New', monospace);
      color: var(--readout-color, #39ff14);
      background: var(--screen-bg, #02140a);
      border: 2px solid var(--accent);
      padding: 6px 14px;
      font-size: 1.15em;
    }

    /* Minimalist controls */
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px 24px;
    }

    .control {
      margin-bottom: 2px;
    }

    .control label {
      display: block;
      font-family: var(--font-body);
      font-size: 0.68em;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #999;
      margin-bottom: 8px;
    }

    .control label span {
      font-family: var(--font-mono, monospace);
      color: var(--accent-dark, #2c3e50);
      font-weight: 600;
      text-transform: none;
      letter-spacing: 0;
      font-size: 1.3em;
    }

    .group-label {
      grid-column: 1 / -1;
      font-family: var(--font-pixel, monospace);
      font-size: 0.55em;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #b0aa93;
      margin-top: 8px;
      padding-top: 14px;
      border-top: 2px dashed #e2ddc9;
      line-height: 1.6;
    }

    .group-label:first-child {
      margin-top: 0;
      padding-top: 0;
      border-top: none;
    }

    .select-wrap {
      position: relative;
    }

    .select-wrap::after {
      content: '';
      position: absolute;
      right: 2px;
      top: 50%;
      width: 0;
      height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid #aaa;
      transform: translateY(-60%);
      pointer-events: none;
    }

    .select-wrap select {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      width: 100%;
      border: none;
      border-bottom: 1px solid #ddd;
      border-radius: 0;
      background: transparent;
      padding: 6px 18px 6px 2px;
      font-size: 0.9em;
      color: #222;
      cursor: pointer;
    }

    .select-wrap select:focus {
      outline: none;
      border-bottom-color: var(--accent, #2c3e50);
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 2px;
      background: #e3e3e3;
      border-radius: 2px;
      outline: none;
      margin: 4px 0;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 0;
      background: var(--accent, #2c3e50);
      border: 2px solid var(--ink, #1c1c1c);
      cursor: pointer;
      transition: transform 0.15s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }

    input[type="range"]::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border: 2px solid var(--ink, #1c1c1c);
      border-radius: 0;
      background: var(--accent, #2c3e50);
      cursor: pointer;
    }

    input[type="range"]::-moz-range-track {
      background: #e3e3e3;
      height: 2px;
      border-radius: 2px;
    }

    .audio-controls {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid #f0f0f0;
      flex-wrap: wrap;
    }

    #audioToggle {
      background: var(--paper, #fff);
      color: var(--ink, #1c1c1c);
      border: 2px solid var(--ink, #1c1c1c);
      padding: 10px 16px;
      box-shadow: 3px 3px 0 var(--accent, #2c3e50);
      cursor: pointer;
      font-family: var(--font-pixel, monospace);
      font-size: 0.6em;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      line-height: 1.4;
      transition: transform 0.08s, box-shadow 0.08s, background 0.15s, color 0.15s;
    }

    #audioToggle::before {
      content: '';
      width: 8px;
      height: 8px;
      background: #ccc;
      transition: background 0.15s;
    }

    #audioToggle:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 var(--accent, #2c3e50);
    }

    #audioToggle.active {
      background: var(--accent, #2c3e50);
      color: var(--ink, #1c1c1c);
    }

    #audioToggle.active::before {
      background: var(--ink, #1c1c1c);
    }

    .audio-controls .control {
      flex: 1;
      min-width: 180px;
      margin-bottom: 0;
    }

    .control.disabled {
      opacity: 0.4;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Générateur de signal</h1>
    <p>Oscilloscope et spectrogramme virtuels avec paramètres réglables</p>
    <a class="btn-pixel" href="index.html">&larr; Accueil</a>
  </header>

  <main>
    <section>
      <div class="instrument-row osc-theme">
        <div class="screen-col">
          <h2>Oscilloscope</h2>
          <div class="scope-wrap">
            <div class="screen-stack">
              <canvas id="scope" width="800" height="640"></canvas>
            </div>
          </div>
          <div class="readout">
            <span id="readoutFreq">f = -- Hz</span>
            <span id="readoutPeriod">T = -- ms</span>
            <span id="readoutVpp">Vpp = -- V</span>
          </div>
        </div>

        <div class="controls-col">
          <div class="controls-grid">
            <div class="group-label">Signal</div>
            <div class="control" id="waveformControl">
              <label for="waveform">Forme d'onde (porteuse)</label>
              <div class="select-wrap">
                <select id="waveform">
                  <option value="sine" selected>Sinusoïdale</option>
                  <option value="square">Carrée</option>
                  <option value="triangle">Triangle</option>
                  <option value="sawtooth">Dents de scie</option>
                  <option value="noise">Bruit blanc</option>
                </select>
              </div>
            </div>

            <div class="control">
              <label for="freq">Fréquence — <span id="freqVal">440</span> Hz</label>
              <input type="range" id="freq" min="0.5" max="2000" step="0.5" value="440">
            </div>

            <div class="control">
              <label for="amplitude">Amplitude — <span id="amplitudeVal">2.0</span> V</label>
              <input type="range" id="amplitude" min="0" max="5" step="0.1" value="2">
            </div>

            <div class="control">
              <label for="offset">Décalage (offset) — <span id="offsetVal">0.0</span> V</label>
              <input type="range" id="offset" min="-5" max="5" step="0.1" value="0">
            </div>

            <div class="control">
              <label for="phase">Phase — <span id="phaseVal">0</span>°</label>
              <input type="range" id="phase" min="0" max="360" step="1" value="0">
            </div>

            <div class="control">
              <label for="noise">Bruit ajouté — <span id="noiseVal">0</span>%</label>
              <input type="range" id="noise" min="0" max="100" step="1" value="0">
            </div>

            <div class="group-label">Modulation</div>
            <div class="control">
              <label for="modulation">Type</label>
              <div class="select-wrap">
                <select id="modulation">
                  <option value="none" selected>Aucune</option>
                  <option value="am">AM</option>
                  <option value="fm">FM</option>
                  <option value="ask">ASK</option>
                  <option value="fsk">FSK</option>
                  <option value="bpsk">BPSK</option>
                </select>
              </div>
            </div>
            <div class="control" data-mod="am fm">
              <label for="messageFreq">Fréquence message — <span id="messageFreqVal">20</span> Hz</label>
              <input type="range" id="messageFreq" min="1" max="200" step="1" value="20">
            </div>
            <div class="control" data-mod="am ask">
              <label for="modDepth">Profondeur — <span id="modDepthVal">50</span>%</label>
              <input type="range" id="modDepth" min="0" max="100" step="1" value="50">
            </div>
            <div class="control" data-mod="fm">
              <label for="modIndex">Indice de modulation — <span id="modIndexVal">2.0</span></label>
              <input type="range" id="modIndex" min="0" max="10" step="0.1" value="2">
            </div>
            <div class="control" data-mod="ask fsk bpsk">
              <label for="symbolRate">Débit symbole — <span id="symbolRateVal">200</span> Bd</label>
              <input type="range" id="symbolRate" min="5" max="1000" step="5" value="200">
            </div>
            <div class="control" data-mod="fsk">
              <label for="freqDeviation">Déviation — <span id="freqDeviationVal">100</span> Hz</label>
              <input type="range" id="freqDeviation" min="10" max="500" step="10" value="100">
            </div>

            <div class="group-label">Balayage</div>
            <div class="control">
              <label for="timeDiv">Base de temps</label>
              <div class="select-wrap">
                <select id="timeDiv">
                  <option value="0.1">0.1 ms/div</option>
                  <option value="0.2">0.2 ms/div</option>
                  <option value="0.5" selected>0.5 ms/div</option>
                  <option value="1">1 ms/div</option>
                  <option value="2">2 ms/div</option>
                  <option value="5">5 ms/div</option>
                  <option value="10">10 ms/div</option>
                  <option value="20">20 ms/div</option>
                  <option value="50">50 ms/div</option>
                </select>
              </div>
            </div>
            <div class="control">
              <label for="voltsDiv">Sensibilité verticale</label>
              <div class="select-wrap">
                <select id="voltsDiv">
                  <option value="0.5">0.5 V/div</option>
                  <option value="1" selected>1 V/div</option>
                  <option value="2">2 V/div</option>
                  <option value="5">5 V/div</option>
                </select>
              </div>
            </div>
          </div>

          <div class="audio-controls">
            <button id="audioToggle" type="button">Activer le son</button>
            <div class="control">
              <label for="volume">Volume — <span id="volumeVal">20</span>%</label>
              <input type="range" id="volume" min="0" max="100" step="1" value="20">
            </div>
          </div>
        </div>
      </div>

      <div class="instrument-row spec-theme">
        <div class="screen-col">
          <h2>Spectrogramme</h2>
          <div class="scope-wrap">
            <div class="screen-stack">
              <canvas id="spectrogram" width="800" height="360"></canvas>
              <canvas id="spectrogramOverlay" class="overlay" width="800" height="360"></canvas>
            </div>
          </div>
          <div class="readout">
            <span id="specReadoutRes">résolution -- Hz/bin</span>
            <span id="specReadoutRange">plage 0 - -- Hz</span>
          </div>
        </div>

        <div class="controls-col">
          <div class="controls-grid">
            <div class="group-label">Analyse</div>
            <div class="control">
              <label for="fftSize">Taille de la FFT</label>
              <div class="select-wrap">
                <select id="fftSize">
                  <option value="256">256</option>
                  <option value="512">512</option>
                  <option value="1024" selected>1024</option>
                  <option value="2048">2048</option>
                </select>
              </div>
            </div>
            <div class="control">
              <label for="windowType">Fenêtre</label>
              <div class="select-wrap">
                <select id="windowType">
                  <option value="hann" selected>Hann</option>
                  <option value="hamming">Hamming</option>
                  <option value="rect">Rectangulaire</option>
                </select>
              </div>
            </div>
            <div class="control">
              <label for="floorDb">Plancher — <span id="floorDbVal">-80</span> dB</label>
              <input type="range" id="floorDb" min="-120" max="-20" step="5" value="-80">
            </div>
            <div class="control">
              <label for="palette">Palette de couleurs</label>
              <div class="select-wrap">
                <select id="palette">
                  <option value="thermal" selected>Thermique</option>
                  <option value="green">Verte</option>
                  <option value="gray">Niveaux de gris</option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Gaspard Houot</p>
  </footer>

  <script>
    (function () {
      'use strict';

      // ============== Shared signal state ==============
      var state = {
        waveform: 'sine',
        freq: 440,
        amplitude: 2,
        offset: 0,
        phaseDeg: 0,
        noisePct: 0,
        modulation: 'none',
        messageFreq: 20,
        modDepth: 50,
        modIndex: 2,
        symbolRate: 200,
        freqDeviation: 100,
        timeDivMs: 0.5,
        voltsDiv: 1,
        volumePct: 20
      };

      var spec = {
        fftSize: 1024,
        windowType: 'hann',
        floorDb: -80,
        palette: 'thermal'
      };

      function baseWave(type, phaseRad) {
        var twoPi = Math.PI * 2;
        var ph = ((phaseRad % twoPi) + twoPi) % twoPi;
        switch (type) {
          case 'sine':
            return Math.sin(ph);
          case 'square':
            return ph < Math.PI ? 1 : -1;
          case 'triangle':
            return (2 / Math.PI) * Math.asin(Math.sin(ph));
          case 'sawtooth':
            return (ph / Math.PI) - 1;
          case 'noise':
            return Math.random() * 2 - 1;
          default:
            return 0;
        }
      }

      // Deterministic pseudo-random bit for a given symbol index, so the same
      // symbol always carries the same bit (stable oscilloscope trace).
      function bitHash(i) {
        var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453123;
        return (x - Math.floor(x)) < 0.5 ? 0 : 1;
      }

      // Computes one signal sample at elapsed time t (seconds), including
      // amplitude/offset/noise — shared by the oscilloscope and spectrogram
      // so both instruments always show the exact same generated signal.
      // Classic modulations (AM/FM/ASK/FSK/BPSK) always ride a sine carrier;
      // the "Forme d'onde" selector only applies when no modulation is active.
      function sampleValue(t, phaseOffsetRad) {
        var v;
        var twoPiFt = 2 * Math.PI * state.freq * t;
        var symbolIdx, bit;
        switch (state.modulation) {
          case 'am': {
            var msg = Math.sin(2 * Math.PI * state.messageFreq * t);
            var envelope = 1 + (state.modDepth / 100) * msg;
            v = envelope * Math.sin(twoPiFt + phaseOffsetRad);
            break;
          }
          case 'fm': {
            var fmMsg = Math.sin(2 * Math.PI * state.messageFreq * t);
            v = Math.sin(twoPiFt + phaseOffsetRad + state.modIndex * fmMsg);
            break;
          }
          case 'ask': {
            symbolIdx = Math.floor(t * state.symbolRate);
            bit = bitHash(symbolIdx);
            var lowAmp = 1 - state.modDepth / 100;
            v = (bit ? 1 : lowAmp) * Math.sin(twoPiFt + phaseOffsetRad);
            break;
          }
          case 'fsk': {
            symbolIdx = Math.floor(t * state.symbolRate);
            bit = bitHash(symbolIdx);
            var f = state.freq + (bit ? state.freqDeviation : -state.freqDeviation);
            v = Math.sin(2 * Math.PI * f * t + phaseOffsetRad);
            break;
          }
          case 'bpsk': {
            symbolIdx = Math.floor(t * state.symbolRate);
            var sign = bitHash(symbolIdx) ? -1 : 1;
            v = sign * Math.sin(twoPiFt + phaseOffsetRad);
            break;
          }
          default:
            v = baseWave(state.waveform, twoPiFt + phaseOffsetRad);
        }
        v = state.amplitude * v + state.offset;
        if (!(state.modulation === 'none' && state.waveform === 'noise') && state.noisePct > 0) {
          v += (Math.random() * 2 - 1) * (state.noisePct / 100) * state.amplitude;
        }
        return v;
      }

      // ============== Oscilloscope (triggered, stable display) ==============
      var canvas = document.getElementById('scope');
      var ctx = canvas.getContext('2d');
      var DIVS_X = 10;
      var DIVS_Y = 8;
      var W = canvas.width;
      var H = canvas.height;
      var buffer = new Float32Array(W);

      var els = {
        waveform: document.getElementById('waveform'),
        freq: document.getElementById('freq'),
        freqVal: document.getElementById('freqVal'),
        amplitude: document.getElementById('amplitude'),
        amplitudeVal: document.getElementById('amplitudeVal'),
        offset: document.getElementById('offset'),
        offsetVal: document.getElementById('offsetVal'),
        phase: document.getElementById('phase'),
        phaseVal: document.getElementById('phaseVal'),
        noise: document.getElementById('noise'),
        noiseVal: document.getElementById('noiseVal'),
        waveformControl: document.getElementById('waveformControl'),
        modulation: document.getElementById('modulation'),
        messageFreq: document.getElementById('messageFreq'),
        messageFreqVal: document.getElementById('messageFreqVal'),
        modDepth: document.getElementById('modDepth'),
        modDepthVal: document.getElementById('modDepthVal'),
        modIndex: document.getElementById('modIndex'),
        modIndexVal: document.getElementById('modIndexVal'),
        symbolRate: document.getElementById('symbolRate'),
        symbolRateVal: document.getElementById('symbolRateVal'),
        freqDeviation: document.getElementById('freqDeviation'),
        freqDeviationVal: document.getElementById('freqDeviationVal'),
        timeDiv: document.getElementById('timeDiv'),
        voltsDiv: document.getElementById('voltsDiv'),
        volume: document.getElementById('volume'),
        volumeVal: document.getElementById('volumeVal'),
        audioToggle: document.getElementById('audioToggle'),
        readoutFreq: document.getElementById('readoutFreq'),
        readoutPeriod: document.getElementById('readoutPeriod'),
        readoutVpp: document.getElementById('readoutVpp'),
        fftSize: document.getElementById('fftSize'),
        windowType: document.getElementById('windowType'),
        floorDb: document.getElementById('floorDb'),
        floorDbVal: document.getElementById('floorDbVal'),
        palette: document.getElementById('palette'),
        specReadoutRes: document.getElementById('specReadoutRes'),
        specReadoutRange: document.getElementById('specReadoutRange')
      };

      // The display always starts drawing at the same trigger phase (the
      // user's phase offset), so the picture stays stationary from frame to
      // frame instead of drifting — like a triggered "normal sweep" scope.
      function renderScopeBuffer() {
        var windowSec = (state.timeDivMs / 1000) * DIVS_X;
        var dtPerPx = windowSec / W;
        var phaseOffsetRad = (state.phaseDeg * Math.PI) / 180;
        for (var x = 0; x < W; x++) {
          buffer[x] = sampleValue(x * dtPerPx, phaseOffsetRad);
        }
      }

      function drawGrid() {
        ctx.fillStyle = '#02140a';
        ctx.fillRect(0, 0, W, H);

        ctx.strokeStyle = 'rgba(57, 255, 20, 0.15)';
        ctx.lineWidth = 1;
        var i, x, y;
        for (i = 1; i < DIVS_X; i++) {
          x = Math.round((i * W) / DIVS_X) + 0.5;
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, H);
          ctx.stroke();
        }
        for (i = 1; i < DIVS_Y; i++) {
          y = Math.round((i * H) / DIVS_Y) + 0.5;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(W, y);
          ctx.stroke();
        }

        ctx.strokeStyle = 'rgba(57, 255, 20, 0.45)';
        ctx.beginPath();
        ctx.moveTo(W / 2 + 0.5, 0);
        ctx.lineTo(W / 2 + 0.5, H);
        ctx.moveTo(0, H / 2 + 0.5);
        ctx.lineTo(W, H / 2 + 0.5);
        ctx.stroke();
      }

      function drawTrace() {
        var pxPerDivY = H / DIVS_Y;
        ctx.strokeStyle = '#39ff14';
        ctx.lineWidth = 2;
        ctx.shadowColor = '#39ff14';
        ctx.shadowBlur = 6;
        ctx.beginPath();
        for (var x = 0; x < W; x++) {
          var v = buffer[x];
          var y = H / 2 - (v / state.voltsDiv) * pxPerDivY;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      function updateReadout() {
        els.readoutFreq.textContent = 'f = ' + state.freq.toFixed(1) + ' Hz';
        els.readoutPeriod.textContent = 'T = ' + (1000 / state.freq).toFixed(3) + ' ms';
        els.readoutVpp.textContent = 'Vpp = ' + (2 * state.amplitude).toFixed(2) + ' V';
      }

      var modControls = document.querySelectorAll('[data-mod]');

      // Shows only the parameters relevant to the selected modulation, and
      // greys out the carrier waveform picker since modulated signals always
      // ride a sine carrier.
      function updateModulationVisibility() {
        var mod = state.modulation;
        for (var i = 0; i < modControls.length; i++) {
          var list = modControls[i].getAttribute('data-mod').split(' ');
          modControls[i].hidden = list.indexOf(mod) === -1;
        }
        els.waveform.disabled = mod !== 'none';
        els.waveformControl.classList.toggle('disabled', mod !== 'none');
      }

      // ============== Spectrogram (waterfall FFT) ==============
      var specCanvas = document.getElementById('spectrogram');
      var specCtx = specCanvas.getContext('2d');
      var specOverlay = document.getElementById('spectrogramOverlay');
      var specOverlayCtx = specOverlay.getContext('2d');
      var SW = specCanvas.width;
      var SH = specCanvas.height;
      var SPEC_SR = 16000; // internal sample rate used for spectral analysis
      var SPEC_MAX_LEN = 2048;
      var specBuffer = new Float32Array(SPEC_MAX_LEN);
      var specTimeAccum = 0;
      var specCarry = 0;

      function pushSpecSamples(n, dtPerSample) {
        if (n <= 0) return;
        if (n > SPEC_MAX_LEN) n = SPEC_MAX_LEN;
        specBuffer.copyWithin(0, n);
        var phaseOffsetRad = (state.phaseDeg * Math.PI) / 180;
        for (var i = SPEC_MAX_LEN - n; i < SPEC_MAX_LEN; i++) {
          specTimeAccum += dtPerSample;
          specBuffer[i] = sampleValue(specTimeAccum, phaseOffsetRad);
        }
      }

      function applyWindow(data, type) {
        var n = data.length;
        var out = new Float64Array(n);
        for (var i = 0; i < n; i++) {
          var w;
          if (type === 'hann') w = 0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (n - 1));
          else if (type === 'hamming') w = 0.54 - 0.46 * Math.cos((2 * Math.PI * i) / (n - 1));
          else w = 1;
          out[i] = data[i] * w;
        }
        return out;
      }

      // Iterative radix-2 Cooley-Tukey FFT (in place, n must be a power of two)
      function fft(re, im) {
        var n = re.length;
        for (var i = 1, j = 0; i < n; i++) {
          var bit = n >> 1;
          for (; j & bit; bit >>= 1) j ^= bit;
          j ^= bit;
          if (i < j) {
            var tr = re[i]; re[i] = re[j]; re[j] = tr;
            var ti = im[i]; im[i] = im[j]; im[j] = ti;
          }
        }
        for (var len = 2; len <= n; len <<= 1) {
          var ang = (-2 * Math.PI) / len;
          var wr = Math.cos(ang), wi = Math.sin(ang);
          for (var start = 0; start < n; start += len) {
            var curWr = 1, curWi = 0;
            var half = len / 2;
            for (var k = 0; k < half; k++) {
              var uRe = re[start + k], uIm = im[start + k];
              var vRe = re[start + k + half] * curWr - im[start + k + half] * curWi;
              var vIm = re[start + k + half] * curWi + im[start + k + half] * curWr;
              re[start + k] = uRe + vRe;
              im[start + k] = uIm + vIm;
              re[start + k + half] = uRe - vRe;
              im[start + k + half] = uIm - vIm;
              var nWr = curWr * wr - curWi * wi;
              var nWi = curWr * wi + curWi * wr;
              curWr = nWr; curWi = nWi;
            }
          }
        }
      }

      var GREEN_STOPS = [[0, [2, 10, 6]], [0.4, [10, 90, 40]], [0.7, [60, 200, 60]], [1, [210, 255, 120]]];
      var THERMAL_STOPS = [[0, [5, 5, 25]], [0.3, [70, 10, 110]], [0.6, [200, 40, 60]], [0.85, [250, 150, 20]], [1, [255, 255, 190]]];
      var GRAY_STOPS = [[0, [0, 0, 0]], [1, [255, 255, 255]]];

      function interpolateStops(stops, t) {
        for (var i = 0; i < stops.length - 1; i++) {
          var a = stops[i], b = stops[i + 1];
          if (t >= a[0] && t <= b[0]) {
            var localT = (t - a[0]) / (b[0] - a[0] || 1);
            return [
              a[1][0] + (b[1][0] - a[1][0]) * localT,
              a[1][1] + (b[1][1] - a[1][1]) * localT,
              a[1][2] + (b[1][2] - a[1][2]) * localT
            ];
          }
        }
        return stops[stops.length - 1][1];
      }

      function paletteColor(t) {
        var stops = spec.palette === 'thermal' ? THERMAL_STOPS : (spec.palette === 'gray' ? GRAY_STOPS : GREEN_STOPS);
        return interpolateStops(stops, t);
      }

      function updateSpectrogram() {
        var n = spec.fftSize;
        var slice = specBuffer.subarray(SPEC_MAX_LEN - n);
        var windowed = applyWindow(slice, spec.windowType);
        var re = new Float64Array(n);
        var im = new Float64Array(n);
        for (var i = 0; i < n; i++) re[i] = windowed[i];
        fft(re, im);

        var bins = n / 2;
        var nyquist = SPEC_SR / 2;
        var ceilDb = 20;

        // New data enters at the top (y=0) and pushes older rows down, so
        // frequency runs horizontally (x) and time runs vertically (y).
        specCtx.drawImage(specCanvas, 0, 1);
        var row = specCtx.createImageData(SW, 1);
        for (var x = 0; x < SW; x++) {
          var freq = nyquist * (x / SW);
          var binIdx = Math.round((freq / nyquist) * bins);
          if (binIdx < 0) binIdx = 0;
          if (binIdx >= bins) binIdx = bins - 1;
          var mag = Math.sqrt(re[binIdx] * re[binIdx] + im[binIdx] * im[binIdx]) * (2 / n);
          var db = 20 * Math.log10(Math.max(mag, 1e-8));
          var t = (db - spec.floorDb) / (ceilDb - spec.floorDb);
          if (t < 0) t = 0;
          if (t > 1) t = 1;
          var color = paletteColor(t);
          var idx = x * 4;
          row.data[idx] = color[0];
          row.data[idx + 1] = color[1];
          row.data[idx + 2] = color[2];
          row.data[idx + 3] = 255;
        }
        specCtx.putImageData(row, 0, 0);
      }

      function drawSpecOverlay() {
        specOverlayCtx.clearRect(0, 0, SW, SH);
        var nyquist = SPEC_SR / 2;
        specOverlayCtx.strokeStyle = 'rgba(255, 176, 32, 0.2)';
        specOverlayCtx.fillStyle = 'rgba(255, 200, 130, 0.85)';
        specOverlayCtx.font = '16px monospace';
        specOverlayCtx.textBaseline = 'top';
        var divs = 4;
        for (var i = 0; i <= divs; i++) {
          var x = (i * SW) / divs;
          var freq = nyquist * (i / divs);
          specOverlayCtx.beginPath();
          specOverlayCtx.moveTo(x + 0.5, 0);
          specOverlayCtx.lineTo(x + 0.5, SH);
          specOverlayCtx.stroke();
          var label = Math.round(freq) + ' Hz';
          var textWidth = specOverlayCtx.measureText(label).width;
          var tx = Math.max(4, Math.min(x + 4, SW - textWidth - 4));
          specOverlayCtx.fillText(label, tx, 4);
        }
      }

      function updateSpecReadout() {
        var res = SPEC_SR / spec.fftSize;
        els.specReadoutRes.textContent = 'résolution ' + res.toFixed(1) + ' Hz/bin';
        els.specReadoutRange.textContent = 'plage 0 - ' + (SPEC_SR / 2) + ' Hz';
      }

      // ============== Animation loop ==============
      var lastTime = null;
      var pxCarry = 0; // reused as spec sample carry

      function frame(now) {
        if (lastTime === null) lastTime = now;
        var dt = (now - lastTime) / 1000;
        lastTime = now;

        renderScopeBuffer();
        drawGrid();
        drawTrace();

        var dtPerSample = 1 / SPEC_SR;
        var samplesToAdd = dt * SPEC_SR + pxCarry;
        var n = Math.floor(samplesToAdd);
        pxCarry = samplesToAdd - n;
        pushSpecSamples(n, dtPerSample);
        updateSpectrogram();

        requestAnimationFrame(frame);
      }

      // ============== Audio (Web Audio API) ==============
      var audioCtx = null;
      var oscNode = null;
      var noiseSource = null;
      var gainNode = null;
      var amEnvGain = null;
      var amLfoOsc = null;
      var amLfoGain = null;
      var amDcOffset = null;
      var fmModOsc = null;
      var fmModGain = null;
      var audioPlaying = false;

      function createNoiseBuffer(ctx) {
        var bufferSize = ctx.sampleRate * 2;
        var buf = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        var data = buf.getChannelData(0);
        for (var i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        return buf;
      }

      function getGainValue() {
        var maxGain = 0.3;
        return (state.volumePct / 100) * maxGain * (state.amplitude / 5);
      }

      function startAudio() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();

        gainNode = audioCtx.createGain();
        gainNode.gain.value = getGainValue();
        gainNode.connect(audioCtx.destination);

        if (state.modulation === 'am') {
          // Ring-modulation trick: LFO -> gain(depth) -> envelope gain's
          // AudioParam, summed with a ConstantSource holding the "1 +" term.
          oscNode = audioCtx.createOscillator();
          oscNode.type = 'sine';
          oscNode.frequency.value = state.freq;

          amEnvGain = audioCtx.createGain();
          amEnvGain.gain.value = 1;

          amLfoOsc = audioCtx.createOscillator();
          amLfoOsc.type = 'sine';
          amLfoOsc.frequency.value = state.messageFreq;

          amLfoGain = audioCtx.createGain();
          amLfoGain.gain.value = state.modDepth / 100;

          amDcOffset = audioCtx.createConstantSource();
          amDcOffset.offset.value = 1;

          amLfoOsc.connect(amLfoGain);
          amLfoGain.connect(amEnvGain.gain);
          amDcOffset.connect(amEnvGain.gain);
          oscNode.connect(amEnvGain);
          amEnvGain.connect(gainNode);

          oscNode.start();
          amLfoOsc.start();
          amDcOffset.start();
        } else if (state.modulation === 'fm') {
          // Classic FM synthesis: modulator -> gain(deviation Hz) -> carrier frequency.
          oscNode = audioCtx.createOscillator();
          oscNode.type = 'sine';
          oscNode.frequency.value = state.freq;

          fmModOsc = audioCtx.createOscillator();
          fmModOsc.type = 'sine';
          fmModOsc.frequency.value = state.messageFreq;

          fmModGain = audioCtx.createGain();
          fmModGain.gain.value = state.modIndex * state.messageFreq;

          fmModOsc.connect(fmModGain);
          fmModGain.connect(oscNode.frequency);
          oscNode.connect(gainNode);

          oscNode.start();
          fmModOsc.start();
        } else if (state.modulation === 'none' && state.waveform === 'noise') {
          noiseSource = audioCtx.createBufferSource();
          noiseSource.buffer = createNoiseBuffer(audioCtx);
          noiseSource.loop = true;
          noiseSource.connect(gainNode);
          noiseSource.start();
        } else {
          // Plain carrier for the basic waveforms, and an approximation for
          // ASK/FSK/BPSK (the Web Audio API has no native digital keying).
          oscNode = audioCtx.createOscillator();
          oscNode.type = state.modulation === 'none' ? state.waveform : 'sine';
          oscNode.frequency.value = state.freq;
          oscNode.connect(gainNode);
          oscNode.start();
        }
        audioPlaying = true;
        els.audioToggle.textContent = 'Couper le son';
        els.audioToggle.classList.add('active');
      }

      function stopAudio() {
        if (oscNode) {
          oscNode.stop();
          oscNode.disconnect();
          oscNode = null;
        }
        if (noiseSource) {
          noiseSource.stop();
          noiseSource.disconnect();
          noiseSource = null;
        }
        if (amEnvGain) {
          amEnvGain.disconnect();
          amEnvGain = null;
        }
        if (amLfoOsc) {
          amLfoOsc.stop();
          amLfoOsc.disconnect();
          amLfoOsc = null;
        }
        if (amLfoGain) {
          amLfoGain.disconnect();
          amLfoGain = null;
        }
        if (amDcOffset) {
          amDcOffset.stop();
          amDcOffset.disconnect();
          amDcOffset = null;
        }
        if (fmModOsc) {
          fmModOsc.stop();
          fmModOsc.disconnect();
          fmModOsc = null;
        }
        if (fmModGain) {
          fmModGain.disconnect();
          fmModGain = null;
        }
        if (gainNode) {
          gainNode.disconnect();
          gainNode = null;
        }
        audioPlaying = false;
        els.audioToggle.textContent = 'Activer le son';
        els.audioToggle.classList.remove('active');
      }

      function restartAudioIfPlaying() {
        if (audioPlaying) {
          stopAudio();
          startAudio();
        }
      }

      function updateAudioParams() {
        if (!audioPlaying) return;
        var now = audioCtx.currentTime;
        if (oscNode) oscNode.frequency.setTargetAtTime(state.freq, now, 0.01);
        if (gainNode) gainNode.gain.setTargetAtTime(getGainValue(), now, 0.01);
        if (amLfoOsc) amLfoOsc.frequency.setTargetAtTime(state.messageFreq, now, 0.01);
        if (amLfoGain) amLfoGain.gain.setTargetAtTime(state.modDepth / 100, now, 0.01);
        if (fmModOsc) fmModOsc.frequency.setTargetAtTime(state.messageFreq, now, 0.01);
        if (fmModGain) fmModGain.gain.setTargetAtTime(state.modIndex * state.messageFreq, now, 0.01);
      }

      els.audioToggle.addEventListener('click', function () {
        if (audioPlaying) stopAudio();
        else startAudio();
      });

      // ============== Bindings ==============
      function bindRange(input, span, decimals, onChange) {
        input.addEventListener('input', function () {
          var v = parseFloat(input.value);
          if (span) span.textContent = decimals === undefined ? v : v.toFixed(decimals);
          onChange(v);
        });
      }

      bindRange(els.freq, els.freqVal, 1, function (v) {
        state.freq = v;
        updateReadout();
        updateAudioParams();
      });
      bindRange(els.amplitude, els.amplitudeVal, 1, function (v) {
        state.amplitude = v;
        updateReadout();
        updateAudioParams();
      });
      bindRange(els.offset, els.offsetVal, 1, function (v) {
        state.offset = v;
      });
      bindRange(els.phase, els.phaseVal, 0, function (v) {
        state.phaseDeg = v;
      });
      bindRange(els.noise, els.noiseVal, 0, function (v) {
        state.noisePct = v;
      });
      bindRange(els.messageFreq, els.messageFreqVal, 0, function (v) {
        state.messageFreq = v;
        updateAudioParams();
      });
      bindRange(els.modDepth, els.modDepthVal, 0, function (v) {
        state.modDepth = v;
        updateAudioParams();
      });
      bindRange(els.modIndex, els.modIndexVal, 1, function (v) {
        state.modIndex = v;
        updateAudioParams();
      });
      bindRange(els.symbolRate, els.symbolRateVal, 0, function (v) {
        state.symbolRate = v;
      });
      bindRange(els.freqDeviation, els.freqDeviationVal, 0, function (v) {
        state.freqDeviation = v;
      });
      bindRange(els.volume, els.volumeVal, 0, function (v) {
        state.volumePct = v;
        updateAudioParams();
      });

      els.waveform.addEventListener('change', function () {
        state.waveform = els.waveform.value;
        restartAudioIfPlaying();
      });
      els.modulation.addEventListener('change', function () {
        state.modulation = els.modulation.value;
        updateModulationVisibility();
        restartAudioIfPlaying();
      });
      els.timeDiv.addEventListener('change', function () {
        state.timeDivMs = parseFloat(els.timeDiv.value);
      });
      els.voltsDiv.addEventListener('change', function () {
        state.voltsDiv = parseFloat(els.voltsDiv.value);
      });

      els.fftSize.addEventListener('change', function () {
        spec.fftSize = parseInt(els.fftSize.value, 10);
        updateSpecReadout();
      });
      els.windowType.addEventListener('change', function () {
        spec.windowType = els.windowType.value;
      });
      bindRange(els.floorDb, els.floorDbVal, 0, function (v) {
        spec.floorDb = v;
      });
      els.palette.addEventListener('change', function () {
        spec.palette = els.palette.value;
      });

      // ============== Init ==============
      updateReadout();
      updateModulationVisibility();
      updateSpecReadout();
      drawSpecOverlay();
      specCtx.fillStyle = '#0a0a10';
      specCtx.fillRect(0, 0, SW, SH);
      drawGrid();
      requestAnimationFrame(frame);

      window.addEventListener('beforeunload', function () {
        if (audioPlaying) stopAudio();
      });
    })();
  </script>

</body>
</html>
